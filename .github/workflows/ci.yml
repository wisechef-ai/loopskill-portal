name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (Astro)
        run: npx astro check
        # Astro check is strict — TS errors fail the build.
        # If a flaky upstream type makes it block, downgrade to `|| true` ONLY with a TODO + ticket.

      - name: Build
        env:
          RECIPES_API_KEY: ${{ secrets.RECIPES_API_KEY }}
        run: npm run build

      - name: Verify multi-page output (no SPA-fallback regression)
        # See pitfall #29 in recipes-marketplace-deploy skill: SPA fallback bug
        # served homepage HTML for every route. Catch it pre-deploy by asserting
        # distinct page sizes for /skills, /pricing, /carousel, /stats.
        run: |
          set -e
          home_size=$(stat -c %s dist/index.html)
          for route in skills pricing carousel stats integrations graph; do
            page="dist/$route/index.html"
            if [ ! -f "$page" ]; then
              echo "ERROR: $route/index.html not built"
              exit 1
            fi
            page_size=$(stat -c %s "$page")
            if [ "$page_size" -eq "$home_size" ]; then
              echo "ERROR: /$route is byte-identical to / — SPA-fallback regression"
              exit 1
            fi
            echo "✓ /$route ($page_size bytes, distinct from /)"
          done

      - name: Verify /graph page renders skill-graph nodes
        # Stage 3 (G17): /graph embeds the full skill graph as inline JSON
        # so the client can run a force-directed layout without re-fetching.
        # If the API was unreachable at build time, the JSON shrinks to {nodes:[]}
        # — render becomes a useless empty box. Catch that here.
        run: |
          set -e
          NODES=$(grep -oE '"slug":"[^"]+"' dist/graph/index.html | wc -l)
          if [ "$NODES" -lt 10 ]; then
            echo "ERROR: /graph contains only $NODES nodes — build-time API fetch failed or graph is empty"
            exit 1
          fi
          echo "✓ /graph contains $NODES nodes"

      - name: Verify /skills renders the full catalog
        # Regression guard against build-time rate-limit causing fallback-to-seed
        # (where /skills shows just 'client-reporter' and nothing else).
        run: |
          set -e
          CARDS=$(grep -oE 'href="/skills/[a-z][a-z0-9-]+"' dist/skills/index.html | sort -u | wc -l)
          if [ "$CARDS" -lt 10 ]; then
            echo "ERROR: /skills page renders only $CARDS skill cards — likely build-time API failure"
            exit 1
          fi
          echo "✓ /skills renders $CARDS skill cards"

      - name: Verify auth-aware nav helper present in bundles
        # Regression guard for the "Sign in / Get access still visible while logged in"
        # bug fixed 2026-04-30. The fix adds inline style.display swaps; if a future
        # refactor strips this, the bug returns silently. CI catches it here.
        run: |
          if ! grep -RIq 'data-auth-anon' dist/index.html; then
            echo "ERROR: data-auth-anon hook missing from index.html — Nav.astro regressed"
            exit 1
          fi
          if ! grep -RIq 'style.display' dist/index.html; then
            echo "ERROR: inline style.display swap missing — Nav anon-CTA hide will break at md+ breakpoint"
            exit 1
          fi
          echo "✓ Nav.astro auth-aware hooks present"

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # mesh_0408 T2-B: the portal is a STATIC Astro build and prod serves an
  # rsynced dist/. A skill published through the API is therefore INVISIBLE on
  # /skills/<slug> until this workflow runs again — and before this input
  # existed, the only trigger was a push to main, so the storefront could only
  # be refreshed by an unrelated portal PR. That made the publish->visible gap
  # UNBOUNDED. Proven 2026-08-05: buzz-mesh-linux-build was API-200 and
  # portal-404 with no way to rebuild short of a no-op commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# artifactfree_0730: this workflow builds AND deploys in ONE job, so the
# concurrency group has to serve two opposed needs:
#   - branch/PR runs: cancel superseded runs, they're pure CI feedback.
#   - push-to-main runs: NEVER cancel — a cancelled run can kill the deploy
#     mid-swap, between `mv dist dist.bak` and `mv dist.incoming dist`, which
#     leaves the origin with NO dist at all. This was previously guaranteed by
#     giving the separate `deploy` job its own non-cancellable group; with one
#     job, it has to be expressed here instead.
concurrency:
  group: >-
    ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push')
        && 'portal-prod-deploy'
        || format('ci-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.ref == 'refs/heads/main' && github.event_name == 'push') }}

jobs:
  build:
    name: Build (Astro) + deploy on main
    # mesh0408e2e (D-018 public-release audit, W3 §D4): this job runs on a
    # SELF-HOSTED runner that lives on the production host. Once this repo is
    # public, a pull_request from a FORK would otherwise execute attacker-
    # authored code there — the standard GitHub Actions footgun.
    #
    # The GitHub "require approval for fork PRs" setting is the usual mitigation,
    # but it is an org-level toggle that can be changed without touching this
    # repo, and it is invisible from inside the code. This condition is the
    # durable half: a fork PR simply does not run. Same-repo PRs and pushes are
    # unaffected, so the gate that guards main keeps working exactly as before.
    #
    # `head.repo.full_name` is empty for `push`, hence the event_name clause.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    # ponytail_0725: was `wisechef-runner` (an org-level Mac). That runner stopped
    # picking up this repo's jobs — a push-to-main sat queued indefinitely with
    # runner_name:"" while the label resolved to nothing. Combined with the SSH
    # deploy failure below, the pipeline had TWO independent single points of
    # failure on hosts this repo does not own. Both are now the prod host, which
    # already runs Node 22 and is the machine the artifact ships to anyway.
    runs-on: wisechef-hq-portal
    # Was 15 on the old standalone deploy job; this job now carries build+deploy,
    # so it needs headroom for npm ci + astro build + vitest on top of the swap.
    timeout-minutes: 30
    env:
      APP_DIR: "/home/wisechef/loopskill-portal"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (Astro)
        run: npx astro check
        # Astro check is strict — TS errors fail the build.
        # If a flaky upstream type makes it block, downgrade to `|| true` ONLY with a TODO + ticket.

      - name: Unit tests (vitest)
        run: npm test
        # Enforced 2026-07-25: 56/233 tests were red for a long time with no
        # CI step ever running them, which is exactly how they were allowed
        # to rot. Fixed in fix/portal-test-suite-green — every remaining
        # failure was either a genuine regression (fixed in src/) or a
        # stale assertion against a deliberately-changed IA (fixed/removed
        # in tests/, each with an evidence comment). This step is what
        # keeps the suite from rotting again.

      - name: Build
        env:
          # qa0208-w3 (dual-accept rename): RECIPES_API_KEY stays the source
          # secret (repo secret rename is out of scope for this PR — do NOT
          # touch repo secrets). Expose it under BOTH env names so src/lib/api.ts's
          # LOOPSKILL_API_KEY-preferred read finds a value today, and so a
          # future secret rename to LOOPSKILL_API_KEY is a no-op here.
          RECIPES_API_KEY: ${{ secrets.RECIPES_API_KEY }}
          LOOPSKILL_API_KEY: ${{ secrets.RECIPES_API_KEY }}
        run: npm run build

      - name: Render tests against the built dist (vitest)
        # spotify_2607 Phase −1. tests/spotify-2607-browse-renders.test.ts loads
        # the BUILT dist/browse/index.html, executes its inline scripts in jsdom
        # against a stubbed API, and asserts real cards land in the DOM.
        #
        # It MUST run after `npm run build`, not in the `npm test` step above:
        # those dist-dependent cases self-skip when dist/ is absent (so a fresh
        # clone doesn't report a false failure), which would make them silently
        # no-op in CI if run pre-build. Running them here is what makes the
        # render assertions real rather than decorative.
        # mesh0408 W3 adds the storefront guards for the same reason: their
        # dist-dependent cases (audit-links / audit-claims over the real build)
        # self-skip when dist/ is absent, so they only mean something here.
        run: |
          npx vitest run tests/spotify-2607-browse-renders.test.ts
          npx vitest run tests/mesh0408-w3-storefront-guards.test.ts

      - name: Executable-docs gate — run every documented llms.txt / docs/* command
        # bundles_0811 P0. tests/p0-docs-commands-execute.test.ts consumes
        # tests/lib/doc-command-extract.ts (PR #52) and EXECUTES every
        # extracted HTTP command against live prod, asserting a 2xx or an
        # explicit documented non-2xx contract (auth-gated endpoints, the
        # deliberately-dead /openapi.json link, the MCP-401-anonymous
        # contract from issue #217). "A reviewed doc rots, a tested doc
        # cannot" — this is the test that makes that literally true: a
        # stale slug, a renamed param, or a changed status contract now
        # fails the BUILD, not a changelog nobody reads.
        #
        # Placement: deliberately BEFORE the deploy steps below, in the same
        # gating position as the other pre-deploy checks in this job (astro
        # check, unit tests, dist-render tests). This job builds AND deploys
        # in one run (see the concurrency-group comment above) specifically
        # so a check failure here fails the whole job before any dist ever
        # reaches dist.incoming/the atomic swap — prod is never left with a
        # half-swapped or docs-broken dist because the deploy steps simply
        # never execute when this step is red.
        env:
          # fix/216-tool-count-drift-46: the new #216 re-rot guard's
          # GET /api/marketing/snapshot call was hitting live prod's
          # ANONYMOUS 60/min-per-IP rate limiter (app/middleware/rate_limit.py
          # on loopskill-api) and 429ing — this self-hosted runner shares an
          # outbound IP with the rest of the prod host's own traffic, so the
          # anonymous bucket is contended by more than just this job.
          # RateLimitMiddleware.dispatch bypasses the IP bucket entirely for
          # any authenticated scope (`if scope and scope != "anonymous":
          # return await call_next(...)`), so sending a real key sidesteps
          # the contention instead of racing it. The endpoint itself needs
          # no key (it's public) — this is purely a rate-limit bypass.
          RECIPES_API_KEY: ${{ secrets.RECIPES_API_KEY }}
        run: npx vitest run tests/p0-docs-commands-execute.test.ts

      - name: Stamp build id into dist (deploy-identity canary source)
        # ponytail_0725. The deploy job asserts that the LIVE origin serves THIS
        # exact build. Guessing at content-hash asset names is unreliable: Astro
        # only rehashes assets whose content changed, so an unchanged component's
        # hash is identical between a fresh build and a week-stale one — the very
        # staleness the canary exists to detect. A commit-pinned stamp is
        # unambiguous: it differs on every commit, by construction.
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > dist/build-id.txt
          echo "Stamped dist/build-id.txt = ${GITHUB_SHA}"

      - name: Verify multi-page output (no SPA-fallback regression)
        # See pitfall #29 in recipes-marketplace-deploy skill: SPA fallback bug
        # served homepage HTML for every route. Catch it pre-deploy by asserting
        # distinct page sizes for /skills, /pricing, /carousel, /stats.
        run: |
          set -e
          home_size=$(wc -c < dist/index.html | tr -d " ")
          for route in skills pricing carousel integrations; do
            page="dist/$route/index.html"
            if [ ! -f "$page" ]; then
              echo "ERROR: $route/index.html not built"
              exit 1
            fi
            page_size=$(wc -c < "$page" | tr -d " ")
            if [ "$page_size" -eq "$home_size" ]; then
              echo "ERROR: /$route is byte-identical to / — SPA-fallback regression"
              exit 1
            fi
            echo "✓ /$route ($page_size bytes, distinct from /)"
          done

      # /graph check removed (onechrome_0611 D5): page disabled, Caddy 301 → /skills.

      - name: Verify /browse renders the catalog shell
        # spotify_2607 Phase −1: this step used to grep dist/skills/index.html
        # for `href="/skills/<slug>"` cards. That page is now a RedirectStub to
        # /browse?type=skills (feat/spotify-ia), so the check counted cards on a
        # redirect shim and emitted "renders only 0 skill cards" on EVERY run —
        # a permanent false warning that trained readers to ignore the signal,
        # and which masqueraded as a missing-RECIPES_API_KEY symptom during the
        # repo move. Re-pointed at the page that actually carries the catalog.
        #
        # These are STRUCTURAL checks only. Proof that /browse actually RENDERS
        # is carried by tests/spotify-2607-browse-renders.test.ts (run in the
        # "Render tests against the built dist" step above), which executes the
        # built page's inline scripts in jsdom against a stubbed API and asserts
        # real cards land in the DOM.
        # A string grep cannot distinguish a live fetch from a commented-out one,
        # nor catch a client-side throw — see the Codex review on PR #24.
        run: |
          set -e
          if [ ! -f dist/browse/index.html ]; then
            echo "ERROR: dist/browse/index.html not built"
            exit 1
          fi
          # Document IDENTITY, not byte count: an SPA fallback that differs by a
          # single byte of injected metadata would slip past a size comparison.
          if cmp -s dist/index.html dist/browse/index.html; then
            echo "ERROR: /browse is identical to / — SPA-fallback regression"
            exit 1
          fi
          if ! grep -q 'browse-results' dist/browse/index.html; then
            echo "ERROR: /browse lost its results container — the render target is gone"
            exit 1
          fi
          echo "✓ /browse built, distinct from /, and retains its render target"

      - name: Verify auth-aware nav helper present in bundles
        # Regression guard for the "Sign in / Get access still visible while logged in"
        # bug fixed 2026-04-30. The fix adds inline style.display swaps; if a future
        # refactor strips this, the bug returns silently. CI catches it here.
        # onechrome_0611 P4: Astro now externalizes larger page scripts into
        # dist/_astro/*.js, so grep the whole dist (HTML + JS bundles).
        run: |
          if ! grep -RIq 'data-auth-anon' dist/index.html; then
            echo "ERROR: data-auth-anon hook missing from index.html — auth-aware markup regressed"
            exit 1
          fi
          if ! grep -RIq 'style.display' dist/index.html dist/_astro/; then
            echo "ERROR: inline style.display swap missing — anon-CTA hide will break at md+ breakpoint"
            exit 1
          fi
          echo "✓ auth-aware hooks present"

      # ── Deploy (main pushes only) ────────────────────────────────────────
      # artifactfree_0730: there is NO upload-artifact/download-artifact hop.
      # `build` and `deploy` used to be two jobs on the SAME self-hosted runner
      # (`wisechef-hq-portal`, the prod host — there is exactly one runner with
      # that label), so dist/ was uploaded to GitHub's artifact storage and
      # immediately downloaded back onto the machine that produced it. That
      # round-trip existed only to let `deploy` gate on push+main — a condition
      # an `if:` on each step expresses for free.
      #
      # It cost real money and then broke the pipeline: on 2026-07-30T08:54Z the
      # org Actions storage quota was exhausted (2.96 GB of stale dist artifacts,
      # 1.27 GB of it on the ARCHIVED recipes-portal) and `upload-artifact` began
      # failing hard, skipping deploy and blocking every push to main (issue #30).
      #
      # Fix per musk-5-step: DELETE the step rather than repair it. dist/ never
      # leaves this workspace now, so the entire class of failure — quota,
      # artifact retention, upload flakiness — is deleted, not patched. This
      # mirrors the SSH-removal precedent below, in this same workflow.
      #
      # ── Why no SSH (ponytail_0725 — deploy outage post-mortem) ─────────────
      # This job used to run on the `wisechef-runner` (a Mac) and rsync/ssh into
      # prod as wisechef@77.42.92.141. That runner's key was not accepted by the
      # prod sshd, so EVERY push-to-main deploy failed with
      #   "Permission denied (publickey,password)" → rsync exit 255
      # silently, from 2026-07-17 onward. Builds stayed green, so nothing looked
      # broken — but no portal change reached production for over a week (the
      # like/heart control, PR #98, merged green and never shipped).
      #
      # Fix (musk-5-step: DELETE the step rather than repair it): this now
      # runs on a self-hosted runner ON the prod host itself, so the deploy is
      # plain local file moves. No SSH, no keys, no rsync, no third host — the
      # entire class of credential failure is deleted, not patched. This mirrors
      # how loopskill-api already deploys (runs-on: [self-hosted, loopskill-prod]).

      - name: Sanity check built dist before deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          test -f dist/index.html || { echo "ERR: no index.html in built dist"; exit 1; }
          PAGE_COUNT=$(find dist -name "*.html" | wc -l)
          echo "Built pages: $PAGE_COUNT"
          test "$PAGE_COUNT" -ge 5 || { echo "ERR: only $PAGE_COUNT pages, expected more"; exit 1; }

      - name: Stage build into dist.incoming (local)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # Never write --delete straight onto the live "dist" dir — that serves a
        # half-synced site during transfer. Land in dist.incoming first; the swap
        # step below promotes it atomically.
        run: |
          set -euo pipefail
          rsync -a --delete dist/ "${APP_DIR}/dist.incoming/"
          test -f "${APP_DIR}/dist.incoming/index.html" \
            || { echo "ERR: staging did not land"; exit 1; }

      - name: Atomic swap + backup rotation
        id: swap
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          cd "${APP_DIR}"

          test -d dist.incoming || { echo "ERR: dist.incoming missing — staging step did not land"; exit 1; }
          test -f dist.incoming/index.html || { echo "ERR: dist.incoming/index.html missing"; exit 1; }

          STAMP=$(date -u +%Y%m%d-%H%M%S)

          # artifactfree_0730 (codex adversarial review, item 5): the window
          # between `mv dist dist.bak` and `mv dist.incoming dist` leaves the
          # origin with NO dist at all. The inline `if ! mv` below only covers a
          # FAILED move; it cannot cover the process being KILLED mid-window —
          # job cancellation, the job timeout, or a runner/host failure all send
          # a signal that skips straight past it. Concurrency prevents a
          # superseding run from cancelling us, but not a manual cancel or a
          # timeout. This trap closes that window: on any exit path (including
          # TERM/INT/HUP), if `dist` is absent and our backup exists, put it back.
          #
          # Deliberately NOT a `set -e` self-trigger: the trap re-checks state
          # rather than assuming failure, so a clean success path is a no-op.
          restore_on_abort() {
            rc=$?
            if [ ! -d dist ] && [ -d "dist.bak-${STAMP}" ]; then
              echo "::error::Swap aborted mid-window (rc=${rc}) — restoring dist.bak-${STAMP}"
              mv "dist.bak-${STAMP}" dist || echo "::error::RESTORE FAILED — origin has no dist, manual intervention required"
            fi
            exit "${rc}"
          }
          trap restore_on_abort EXIT INT TERM HUP

          if [ -d dist ]; then
            mv dist "dist.bak-${STAMP}"
          fi

          if ! mv dist.incoming dist; then
            echo "ERR: promote of dist.incoming failed — restoring previous dist"
            if [ -d "dist.bak-${STAMP}" ]; then
              mv "dist.bak-${STAMP}" dist
            fi
            exit 1
          fi

          # Prune backups — keep newest 5 only. NON-FATAL: a permission error
          # on an old/foreign-owned backup dir must never fail a deploy whose
          # content swap already succeeded. Try plain rm, then sudo, then warn.
          for old in $(ls -1dt dist.bak-* 2>/dev/null | tail -n +6); do
            if ! rm -rf "$old" 2>/dev/null; then
              sudo rm -rf "$old" 2>/dev/null \
                || echo "::warning::could not prune stale backup $old (permission denied) — leaving it; deploy is unaffected"
            fi
          done

          echo "Swap complete. Backups now on disk:"
          ls -1dt dist.bak-* 2>/dev/null | head -5

      - name: Post-deploy readiness gate (public routes)
        id: verify
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          FAIL=0
          for path in "/" "/browse" "/bundles/p?slug=coreys-marketing"; do
            OK=0
            URL="https://app.loopskill.io${path}"
            for i in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              echo "attempt $i: $URL -> $CODE"
              if [[ "$CODE" =~ ^(200|301|302)$ ]]; then
                OK=1
                break
              fi
              sleep 3
            done
            if [ "$OK" -ne 1 ]; then
              echo "ERR: $path never became healthy"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "READINESS GATE FAILED"
            exit 1
          fi
          echo "All routes healthy."

      - name: Content canary — the deployed dist must be the dist we just built
        # A green readiness gate only proves the site RESPONDS. It cannot tell a
        # fresh deploy from a week-old one — which is exactly how the 2026-07-17
        # outage stayed invisible for 8 days. This asserts IDENTITY: the origin
        # must serve the build-id stamped by THIS run's build job.
        #
        # Implementation notes (both learned the hard way, ponytail_0725):
        #   1. Compare against $GITHUB_SHA, not an Astro content-hash asset name.
        #      Astro reuses a hash when the asset content is unchanged, so a
        #      stale dist can present the same hash as a fresh one — a canary
        #      that green-lights the exact staleness it exists to catch.
        #   2. NEVER pipe a large shell variable into `grep -q` under
        #      `set -o pipefail`. grep exits on first match and closes the pipe,
        #      the writer takes SIGPIPE, and pipefail promotes that to a step
        #      failure EVEN WHEN THE MATCH SUCCEEDED. The first cut of this
        #      canary did exactly that and failed a deploy that had in fact
        #      landed correctly (log: "printf: write error: Broken pipe").
        #      Compare strings directly instead — no pipes, no subshell exits.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA}"
          echo "Expecting live build-id: ${EXPECTED}"
          LIVE_ID=""
          for i in 1 2 3 4 5; do
            LIVE_ID="$(curl -sS -m 20 --fail-with-body \
              -H 'Cache-Control: no-cache' \
              "https://app.loopskill.io/build-id.txt?cb=${GITHUB_RUN_ID}-${i}" \
              | tr -d '[:space:]')" || LIVE_ID=""
            # NOTE: `[ x = y ] && break` as the last command of a loop body is a
            # `set -e` trap — on the final iteration a false test makes the body
            # exit non-zero and kills the step before the real check below runs.
            # Keep the explicit if/break form.
            if [ "${LIVE_ID}" = "${EXPECTED}" ]; then break; fi
            echo "attempt ${i}: live build-id = '${LIVE_ID:-<none>}' (waiting for propagation)"
            sleep 3
          done
          if [ "${LIVE_ID}" != "${EXPECTED}" ]; then
            echo "::error::DEPLOY DID NOT LAND — https://app.loopskill.io/build-id.txt reports '${LIVE_ID:-<none>}' but this run built '${EXPECTED}'. The origin is serving a different (probably stale) dist."
            exit 1
          fi
          echo "Canary OK — the live origin is serving this exact build (${EXPECTED})."

      - name: Auto-rollback on readiness failure
        # Only fires when the swap actually landed (dist was touched) AND a
        # later step (the readiness gate) failed. If the swap itself failed,
        # it already self-healed inline above — nothing to roll back here.
        if: failure() && steps.swap.outcome == 'success'
        run: |
          set -euo pipefail
          cd "${APP_DIR}"
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          LATEST_BAK=$(ls -1dt dist.bak-* 2>/dev/null | head -1)
          if [ -z "${LATEST_BAK}" ]; then
            echo "ERR: no backup available to roll back to"
            exit 1
          fi
          mv dist "dist.broken-${STAMP}"
          mv "${LATEST_BAK}" dist
          echo "Rolled back to ${LATEST_BAK}"
          echo "::error::Deploy readiness gate failed — rolled back to previous dist on prod."
